<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio WebUI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Top: Variation Selector -->
        <header class="header">
            <div class="variation-buttons" id="variation-buttons">
                <!-- Buttons will be dynamically added here -->
            </div>
            <button id="download-btn" class="download-btn" title="Download portfolio as ZIP">Download ZIP</button>
        </header>

        <!-- Main Content: Preview (left) and Config (right) -->
        <div class="main-content">
            <!-- Left: Preview -->
            <div class="preview-panel">
                <div class="preview-content">
                    <iframe id="preview-frame" src="about:blank"></iframe>
                </div>
            </div>

            <!-- Right: Config Editor -->
            <div class="config-panel">
                <div class="config-content" id="config-editor">
                    <p class="placeholder">Select a variation to edit its configuration</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
